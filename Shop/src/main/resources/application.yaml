server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local,dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/doro_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 2C 机器高并发突发时，客户端线程调度延迟会超过 500ms；超时过短会把闸门退化成 503 风暴
      # 仍低于 DB 连接池 3s 超时，保证 Redis 故障时快速失败
      timeout: 2s
      connect-timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 消费者并发钉死，避免把突发直接压给 Hikari
        concurrency: ${SHOP_SECKILL_ASYNC_CONCURRENCY:8}
        max-concurrency: ${SHOP_SECKILL_ASYNC_CONCURRENCY:8}
        prefetch: 8
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

app:
  jwt:
    secret: ${JWT_SECRET:doroshop-jwt-secret-at-least-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

shop:
  order:
    timeout:
      # 订单超时取消：每轮扫一批，处理完再等下一轮
      enabled: true
      scan-interval-ms: 60000
      initial-delay-ms: 30000
      batch-size: 100
  seckill:
    redis:
      # Redis 只是秒杀准入闸门，库存最终以 MySQL 为准
      prefix: doro:seckill
      task-enabled: true
      reconcile-interval-ms: 300000
      reconcile-initial-delay-ms: 30000
      # 活动详情只缓存元数据，库存/phase/serverTime 实时计算
      activity-cache-enabled: true
      activity-cache-ttl-seconds: 30
      activity-cache-jitter-seconds: 10
      activity-cache-missing-ttl-seconds: 10
    async:
      # 打开后下单只入队并返回 PENDING；关闭时走原有同步事务
      enabled: ${SHOP_SECKILL_ASYNC_ENABLED:false}
      exchange: doroshop.seckill
      queue: doroshop.seckill.order
      routing-key: order
      dead-letter-exchange: doroshop.seckill.dlx
      dead-letter-queue: doroshop.seckill.order.dlq
      result-ttl-seconds: 1800
    bucket:
      # 库存分桶数：活动库存拆成 N 行，降低单行锁竞争
      size: ${SHOP_SECKILL_BUCKET_SIZE:8}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true      # 下划线转驼峰（MP 默认开启，显式写出心里有数）
  global-config:
    banner: true
    db-config:
      id-type: assign_id                    # 雪花 ID（全局默认，实体可不再标 @TableId 类型）
      logic-delete-field: deleted           # 全局逻辑删除字段名
      logic-delete-value: 1
      logic-not-delete-value: 0

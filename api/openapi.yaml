openapi: 3.0.3
info:
  title: DoroShop API
  description: |
    DoroShop 商城前后端接口契约（唯一真相）。
    修改本文件必须走 PR 评审，前后端同步更新；破坏性变更走 /v2 或新增版本。
  version: 1.0.0
  license:
    name: 仅供学习使用
servers:
  - url: http://localhost:8080
    description: 本地开发
security: []
# 说明：当前商品/分类接口均为公开（security: []）。
# 后续订单、秒杀等需登录的接口将在各自 operation 上声明 bearerAuth。
tags:
  - name: Category
    description: 商品分类
  - name: Product
    description: 商品（SPU/SKU）
  - name: Cart
    description: 购物车（需登录）
  - name: Order
    description: 订单（需登录）
  - name: Address
    description: 收货地址（需登录）

paths:
  /category/tree:
    get:
      tags: [Category]
      summary: 分类树（一级分类 + 二级子分类）
      description: 仅返回启用且未删除的分类，按 sort 升序；一级分类无论有无子分类都返回。
      operationId: getCategoryTree
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCategoryTree'
              example:
                code: 200
                message: success
                data:
                  - id: '1900000000000000001'
                    name: 数码
                    sort: 1
                    children:
                      - { id: '1900000000000000011', name: 手机, sort: 1, children: [] }
                      - { id: '1900000000000000012', name: 耳机, sort: 2, children: [] }
                  - id: '1900000000000000002'
                    name: 服饰
                    sort: 2
                    children:
                      - { id: '1900000000000000021', name: 男装, sort: 1, children: [] }
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /product/list:
    get:
      tags: [Product]
      summary: 商品列表（分页 + 分类筛选）
      description: |
        仅返回上架商品（status=1，未删除）。传一级分类 id 时包含其下二级分类的商品。
        列表不返回 detail 大字段。
      operationId: getProductList
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          description: 每页条数
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: categoryId
          in: query
          description: 分类 id（一级或二级），不传则全部
          schema: { type: string }
          example: '1900000000000000011'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProductPage'
              example:
                code: 200
                message: success
                data:
                  total: 2
                  records:
                    - id: '1910000000000000001'
                      name: iPhone 17
                      subtitle: A19 芯片 · 全新影像系统
                      mainImage: /images/spu/iphone17-main.jpg
                      priceMin: 5999.00
                      sales: 1200
                    - id: '1910000000000000002'
                      name: 小米 15
                      subtitle: 骁龙旗舰 · 徕卡影像
                      mainImage: /images/spu/xiaomi15-main.jpg
                      priceMin: 3999.00
                      sales: 860
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /product/{id}:
    get:
      tags: [Product]
      summary: 商品详情（SPU + 图片 + 规格 + SKU）
      description: |
        仅返回上架商品的详情。skus 只包含上架 SKU（status=1），并带上可用库存；
        availableStock=0 表示售罄，前端应置灰不可选。
      operationId: getProductDetail
      parameters:
        - name: id
          in: path
          required: true
          description: SPU id
          schema: { type: string }
          example: '1910000000000000001'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProductDetail'
              example:
                code: 200
                message: success
                data:
                  spu:
                    id: '1910000000000000001'
                    name: iPhone 17
                    subtitle: A19 芯片 · 全新影像系统
                    detail: 6.3 英寸屏幕，A19 芯片，4800 万像素双摄。
                    priceMin: 5999.00
                    sales: 1200
                  images:
                    - { id: '1940000000000000001', url: /images/spu/iphone17-main.jpg, isMain: 1, skuId: null }
                    - { id: '1940000000000000004', url: /images/sku/iphone17-black.jpg, isMain: 1, skuId: '1920000000000000001' }
                  specs:
                    - id: '1950000000000000001'
                      name: 颜色
                      values:
                        - { id: '1960000000000000001', value: 黑色 }
                        - { id: '1960000000000000002', value: 白色 }
                    - id: '1950000000000000002'
                      name: 容量
                      values:
                        - { id: '1960000000000000003', value: 128G }
                        - { id: '1960000000000000004', value: 256G }
                  skus:
                    - id: '1920000000000000001'
                      specDesc: 黑色/128G
                      image: /images/sku/iphone17-black.jpg
                      price: 5999.00
                      originalPrice: 6499.00
                      availableStock: 98
                    - id: '1920000000000000004'
                      specDesc: 白色/256G
                      image: /images/sku/iphone17-white.jpg
                      price: 6799.00
                      originalPrice: 7299.00
                      availableStock: 0
        '404':
          description: 商品不存在或已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /cart/add:
    post:
      tags: [Cart]
      summary: 加入购物车（同一 SKU 累加数量）
      description: |
        需登录。校验 SKU 存在、已上架、可用库存充足；
        同一用户对同一 SKU 重复加购时累加数量（受库存与单次上限约束）。
      operationId: addCartItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddDTO'
            example:
              skuId: '1920000000000000001'
              quantity: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '400':
          description: 参数错误、SKU 已下架或库存不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /cart/list:
    get:
      tags: [Cart]
      summary: 购物车列表（含商品信息与失效标记）
      description: |
        需登录。每项包含商品快照信息（名称、规格、价格、库存）；
        商品下架或库存不足时 invalid=true，前端应提示且不允许结算。
      operationId: getCartList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCartList' }
              example:
                code: 200
                message: success
                data:
                  items:
                    - id: '1980000000000000001'
                      skuId: '1920000000000000001'
                      spuId: '1910000000000000001'
                      name: iPhone 17
                      specDesc: 黑色/128G
                      image: /images/sku/iphone17-black.jpg
                      price: 5999.00
                      quantity: 2
                      selected: 1
                      availableStock: 98
                      invalid: false
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /cart/quantity:
    put:
      tags: [Cart]
      summary: 修改购物车项数量
      operationId: updateCartQuantity
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartQuantityDTO'
            example:
              id: '1980000000000000001'
              quantity: 3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '400':
          description: 参数错误或数量超出库存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: 购物车项不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /cart/select:
    put:
      tags: [Cart]
      summary: 勾选 / 取消勾选购物车项
      operationId: updateCartSelected
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSelectDTO'
            example:
              id: '1980000000000000001'
              selected: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '400':
          description: 参数错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /cart/{id}:
    delete:
      tags: [Cart]
      summary: 删除购物车项
      operationId: deleteCartItem
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: 购物车项 id
          schema: { type: string }
          example: '1980000000000000001'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: 购物车项不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /order/confirm:
    get:
      tags: [Order]
      summary: 结算确认（选中商品 + 默认地址 + 合计）
      description: |
        需登录。读取当前用户购物车中 selected=1 且未失效的商品；
        无选中商品时返回业务码 400。address 为 null 表示用户尚未添加收货地址。
      operationId: confirmOrder
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiOrderConfirm' }
              example:
                code: 200
                message: success
                data:
                  totalAmount: 17997.00
                  address:
                    id: '2115000000000000001'
                    receiverName: 张三
                    receiverPhone: '13800138000'
                    province: 北京市
                    city: 北京市
                    district: 海淀区
                    detail: 中关村大街 1 号
                    isDefault: 1
                  items:
                    - cartId: '2115423856867467265'
                      skuId: '1920000000000000001'
                      spuId: '1910000000000000001'
                      name: iPhone 17
                      specDesc: 黑色/128G
                      image: /images/sku/iphone17-black.jpg
                      price: 5999.00
                      quantity: 3
                      subtotal: 17997.00
        '400':
          description: 没有选中的商品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /order/submit:
    post:
      tags: [Order]
      summary: 提交订单
      description: |
        需登录。服务端以购物车勾选项为准计算金额（不信任客户端价格）：
        校验地址与库存 → 扣减库存（available−n、locked+n）→ 生成订单/明细/地址快照 → 删除已下单购物车项，
        全部在同一事务内完成。任一 SKU 库存不足则整体失败，已扣库存回滚。
      operationId: submitOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderSubmitDTO' }
            example:
              addressId: '2115000000000000001'
              remark: 尽快发货
      responses:
        '200':
          description: 下单成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiOrderSubmit' }
              example:
                code: 200
                message: success
                data:
                  orderId: '2116000000000000001'
                  orderNo: '202610291230001234'
                  payAmount: 17997.00
                  status: 0
                  expireTime: '2026-10-29T13:30:00+08:00'
        '400':
          description: 无选中商品、地址不存在或库存不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /order/list:
    get:
      tags: [Order]
      summary: 我的订单列表（分页 + 状态筛选）
      description: |
        需登录。仅返回当前用户的订单，按创建时间倒序。
        status 为空表示全部；列表项只带首件商品快照与商品件数，不含完整明细。
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: status
          in: query
          description: '0 待支付 / 1 已支付 / 2 已发货 / 3 已完成 / 4 已取消；不传为全部'
          schema: { type: integer, enum: [0, 1, 2, 3, 4] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiOrderPage' }
              example:
                code: 200
                message: success
                data:
                  total: 1
                  records:
                    - id: '2115660222213730305'
                      orderNo: '202610291221180117'
                      status: 0
                      payAmount: 17997.00
                      createTime: '2026-10-29T12:21:18+08:00'
                      firstItemName: iPhone 17
                      firstItemImage: /images/sku/iphone17-black.jpg
                      itemCount: 3
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /order/{id}:
    get:
      tags: [Order]
      summary: 订单详情（订单 + 明细快照 + 地址快照）
      operationId: getOrderDetail
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: '2115660222213730305'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiOrderDetail' }
              example:
                code: 200
                message: success
                data:
                  id: '2115660222213730305'
                  orderNo: '202610291221180117'
                  status: 0
                  totalAmount: 17997.00
                  payAmount: 17997.00
                  remark: test order
                  createTime: '2026-10-29T12:21:18+08:00'
                  expireTime: '2026-10-29T12:51:18+08:00'
                  payTime: null
                  cancelTime: null
                  items:
                    - id: '2115660222213730306'
                      spuId: '1910000000000000001'
                      skuId: '1920000000000000001'
                      productName: iPhone 17
                      specDesc: 黑色/128G
                      image: /images/sku/iphone17-black.jpg
                      price: 5999.00
                      quantity: 3
                      totalAmount: 17997.00
                  address:
                    receiverName: 张三
                    receiverPhone: '13800138000'
                    province: 北京市
                    city: 北京市
                    district: 海淀区
                    detail: 中关村大街 1 号
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: 订单不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /order/{id}/pay:
    post:
      tags: [Order]
      summary: 模拟支付
      description: |
        需登录。仅「待支付」订单可支付；成功后状态变为已支付并释放锁定库存
        （locked_stock −= n，available 不变），同时累加商品销量。
        重复支付返回 400「订单状态不允许支付」，不会产生副作用。
      operationId: payOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: '2115660222213730305'
      responses:
        '200':
          description: 支付成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiOrderPay' }
              example:
                code: 200
                message: success
                data:
                  orderId: '2115660222213730305'
                  orderNo: '202610291221180117'
                  payAmount: 17997.00
                  status: 1
                  payTime: '2026-10-29T12:30:00+08:00'
        '400':
          description: 订单状态不允许支付（已支付 / 已取消）或已超时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: 订单不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /order/{id}/cancel:
    post:
      tags: [Order]
      summary: 取消订单（仅待支付）
      description: |
        仅「待支付」订单可取消。成功后状态变为已取消，并回滚库存
        （available_stock += n、locked_stock −= n）。
      operationId: cancelOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: '2115660222213730305'
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '400':
          description: 订单状态不允许取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: 订单不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /address/list:
    get:
      tags: [Address]
      summary: 收货地址列表
      description: 返回当前用户全部地址，默认地址排在最前，其余按创建时间倒序。
      operationId: listAddresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiAddressList' }
              example:
                code: 200
                message: success
                data:
                  - id: '2115000000000000001'
                    receiverName: 张三
                    receiverPhone: '13800138000'
                    province: 北京市
                    city: 北京市
                    district: 海淀区
                    detail: 中关村大街 1 号
                    isDefault: 1
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /address/add:
    post:
      tags: [Address]
      summary: 新增收货地址
      description: |
        需登录。isDefault=1 时，同一事务内先清除该用户其它默认地址再设置本条；
        最多允许 20 条地址，超出返回 400。
      operationId: addAddress
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressSaveDTO' }
            example:
              receiverName: 李四
              receiverPhone: '13900139000'
              province: 上海市
              city: 上海市
              district: 浦东新区
              detail: 世纪大道 100 号
              isDefault: 0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '400':
          description: 参数错误或地址数量已达上限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /address/{id}:
    put:
      tags: [Address]
      summary: 修改收货地址
      description: 需登录，只能修改自己的地址；isDefault=1 时同样清理其它默认地址。
      operationId: updateAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: '2115000000000000001'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressSaveDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '400':
          description: 参数错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: 地址不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [Address]
      summary: 删除收货地址
      description: 逻辑删除，只能删除自己的地址；删除默认地址后不自动补位（confirm 会回退到最新一条）。
      operationId: deleteAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: '2115000000000000001'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVoid' }
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: 地址不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录接口返回的 accessToken，请求头格式 Authorization: Bearer <token>"
  schemas:
    AddressSaveDTO:
      type: object
      required: [receiverName, receiverPhone, province, city, district, detail, isDefault]
      properties:
        receiverName:
          type: string
          maxLength: 50
          example: 张三
        receiverPhone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: '13800138000'
        province:
          type: string
          maxLength: 50
          example: 北京市
        city:
          type: string
          maxLength: 50
          example: 北京市
        district:
          type: string
          maxLength: 50
          example: 海淀区
        detail:
          type: string
          maxLength: 255
          example: 中关村大街 1 号
        isDefault:
          type: integer
          enum: [0, 1]
          description: 1 设为默认地址（会清除其它默认），0 普通地址

    ApiAddressList:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data:
          type: array
          items: { $ref: '#/components/schemas/UserAddressVO' }

    OrderListItemVO:
      type: object
      required: [id, orderNo, status, payAmount, createTime, itemCount]
      properties:
        id: { type: string }
        orderNo: { type: string, example: '202610291221180117' }
        status:
          type: integer
          description: '0 待支付 / 1 已支付 / 2 已发货 / 3 已完成 / 4 已取消'
        payAmount: { type: number, format: double }
        createTime: { type: string, format: date-time }
        firstItemName: { type: string, example: iPhone 17 }
        firstItemImage: { type: string, nullable: true }
        itemCount: { type: integer, description: 商品总件数 }

    OrderItemVO:
      type: object
      required: [id, spuId, skuId, productName, specDesc, price, quantity, totalAmount]
      properties:
        id: { type: string }
        spuId: { type: string }
        skuId: { type: string }
        productName: { type: string }
        specDesc: { type: string }
        image: { type: string, nullable: true }
        price: { type: number, format: double, description: 下单时单价（快照） }
        quantity: { type: integer }
        totalAmount: { type: number, format: double }

    OrderAddressVO:
      type: object
      required: [receiverName, receiverPhone, province, city, district, detail]
      properties:
        receiverName: { type: string }
        receiverPhone: { type: string }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        detail: { type: string }

    OrderDetailVO:
      type: object
      required: [id, orderNo, status, totalAmount, payAmount, createTime, expireTime, items]
      properties:
        id: { type: string }
        orderNo: { type: string }
        status:
          type: integer
          description: '0 待支付 / 1 已支付 / 2 已发货 / 3 已完成 / 4 已取消'
        totalAmount: { type: number, format: double }
        payAmount: { type: number, format: double }
        remark: { type: string, nullable: true }
        createTime: { type: string, format: date-time }
        expireTime: { type: string, format: date-time }
        payTime: { type: string, format: date-time, nullable: true }
        cancelTime: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemVO' }
        address:
          description: 订单收货地址快照
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OrderAddressVO'

    OrderPayVO:
      type: object
      required: [orderId, orderNo, payAmount, status, payTime]
      properties:
        orderId: { type: string }
        orderNo: { type: string }
        payAmount: { type: number, format: double }
        status: { type: integer, example: 1 }
        payTime: { type: string, format: date-time }

    OrderPage:
      type: object
      required: [total, records]
      properties:
        total: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/OrderListItemVO' }

    ApiOrderPage:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/OrderPage' }

    ApiOrderDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/OrderDetailVO' }

    ApiOrderPay:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/OrderPayVO' }

    OrderSubmitDTO:
      type: object
      required: [addressId]
      properties:
        addressId:
          type: string
          description: 收货地址 id
          example: '2115000000000000001'
        remark:
          type: string
          maxLength: 255
          nullable: true
          description: 用户备注

    UserAddressVO:
      type: object
      required: [id, receiverName, receiverPhone, province, city, district, detail, isDefault]
      properties:
        id: { type: string }
        receiverName: { type: string, example: 张三 }
        receiverPhone: { type: string, example: '13800138000' }
        province: { type: string, example: 北京市 }
        city: { type: string, example: 北京市 }
        district: { type: string, example: 海淀区 }
        detail: { type: string, example: 中关村大街 1 号 }
        isDefault: { type: integer, description: '1 默认地址 0 普通地址' }

    ConfirmItemVO:
      type: object
      required: [cartId, skuId, spuId, name, specDesc, price, quantity, subtotal]
      properties:
        cartId: { type: string, description: 购物车项 id }
        skuId: { type: string }
        spuId: { type: string }
        name: { type: string }
        specDesc: { type: string }
        image: { type: string, nullable: true }
        price:
          type: number
          format: double
          description: 当前售价（提交订单时以服务端价格为准）
        quantity: { type: integer }
        subtotal:
          type: number
          format: double
          description: price × quantity

    OrderConfirmVO:
      type: object
      required: [items, totalAmount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfirmItemVO' }
        totalAmount:
          type: number
          format: double
        address:
          description: 默认收货地址；为 null 表示尚未添加
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserAddressVO'

    OrderSubmitVO:
      type: object
      required: [orderId, orderNo, payAmount, status, expireTime]
      properties:
        orderId: { type: string }
        orderNo:
          type: string
          description: 展示用订单号
          example: '202610291230001234'
        payAmount:
          type: number
          format: double
        status:
          type: integer
          description: '0 待支付 / 1 已支付 / 2 已发货 / 3 已完成 / 4 已取消'
        expireTime:
          type: string
          format: date-time
          description: 支付截止时间

    ApiOrderConfirm:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/OrderConfirmVO' }

    ApiOrderSubmit:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/OrderSubmitVO' }

    CartAddDTO:
      type: object
      required: [skuId, quantity]
      properties:
        skuId:
          type: string
          description: SKU id
          example: '1920000000000000001'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          default: 1

    CartQuantityDTO:
      type: object
      required: [id, quantity]
      properties:
        id:
          type: string
          description: 购物车项 id
          example: '1980000000000000001'
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    CartSelectDTO:
      type: object
      required: [id, selected]
      properties:
        id:
          type: string
          description: 购物车项 id
        selected:
          type: integer
          enum: [0, 1]
          description: 1 勾选结算，0 取消勾选

    CartItemVO:
      type: object
      required: [id, skuId, spuId, name, specDesc, price, quantity, selected, availableStock, invalid]
      properties:
        id:
          type: string
          description: 购物车项 id
        skuId: { type: string }
        spuId:
          type: string
          description: 所属 SPU id，前端用于从购物车跳转商品详情页
        name:
          type: string
          description: 商品名称（快照展示用）
        specDesc:
          type: string
          description: 规格描述，如"黑色/128G"
        image:
          type: string
          nullable: true
        price:
          type: number
          format: double
          description: 当前售价（仅供参考，结算以后端为准）
        quantity:
          type: integer
        selected:
          type: integer
          enum: [0, 1]
        availableStock:
          type: integer
          description: 当前可用库存
        invalid:
          type: boolean
          description: true 表示商品已下架或库存不足，不可结算

    CartListVO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemVO' }

    ApiCartList:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/CartListVO' }

    ApiVoid:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data:
          type: object
          nullable: true

    CategoryVO:
      type: object
      required: [id, name, sort, children]
      properties:
        id:
          type: string
          description: 分类 id（雪花 id，字符串传输防止 JS 精度丢失）
          example: '1900000000000000011'
        name: { type: string, example: 手机 }
        sort: { type: integer, example: 1 }
        children:
          type: array
          description: 子分类；一级分类无子分类时为空数组
          items: { $ref: '#/components/schemas/CategoryVO' }

    ProductListItem:
      type: object
      required: [id, name, priceMin, sales]
      properties:
        id: { type: string, example: '1910000000000000001' }
        name: { type: string, example: iPhone 17 }
        subtitle:
          type: string
          nullable: true
          example: A19 芯片 · 全新影像系统
        mainImage:
          type: string
          nullable: true
          description: 主图 URL（相对路径），图片缺失时前端显示占位块
          example: /images/spu/iphone17-main.jpg
        priceMin:
          type: number
          format: double
          description: 最低售价（元）。前端仅展示，不参与金额计算
          example: 5999.00
        sales: { type: integer, example: 1200 }

    ProductPage:
      type: object
      required: [total, records]
      properties:
        total: { type: integer, description: 满足条件的总条数, example: 2 }
        records:
          type: array
          items: { $ref: '#/components/schemas/ProductListItem' }

    ProductSpuVO:
      type: object
      required: [id, name, priceMin, sales]
      properties:
        id: { type: string }
        name: { type: string }
        subtitle: { type: string, nullable: true }
        detail:
          type: string
          nullable: true
          description: 富文本/长文本详情，仅详情接口返回
        priceMin: { type: number, format: double }
        sales: { type: integer }

    ProductImageVO:
      type: object
      required: [id, url, isMain]
      properties:
        id: { type: string }
        url: { type: string }
        isMain: { type: integer, description: '1 主图，0 非主图' }
        skuId:
          type: string
          nullable: true
          description: 为空表示 SPU 通用图（轮播）；非空表示该 SKU 专属图

    ProductSpecValueVO:
      type: object
      required: [id, value]
      properties:
        id: { type: string }
        value: { type: string, example: 黑色 }

    ProductSpecVO:
      type: object
      required: [id, name, values]
      properties:
        id: { type: string }
        name: { type: string, example: 颜色 }
        values:
          type: array
          items: { $ref: '#/components/schemas/ProductSpecValueVO' }

    ProductSkuVO:
      type: object
      required: [id, specDesc, price, availableStock]
      properties:
        id: { type: string }
        specDesc: { type: string, example: 黑色/128G }
        image:
          type: string
          nullable: true
        price: { type: number, format: double }
        originalPrice:
          type: number
          format: double
          nullable: true
        availableStock:
          type: integer
          description: 可用库存；为 0 时前端置灰不可选

    ProductDetail:
      type: object
      required: [spu, images, specs, skus]
      properties:
        spu: { $ref: '#/components/schemas/ProductSpuVO' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImageVO' }
        specs:
          type: array
          items: { $ref: '#/components/schemas/ProductSpecVO' }
        skus:
          type: array
          items: { $ref: '#/components/schemas/ProductSkuVO' }

    ApiCategoryTree:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data:
          type: array
          items: { $ref: '#/components/schemas/CategoryVO' }

    ApiProductPage:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/ProductPage' }

    ApiProductDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/ProductDetail' }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 404 }
        message: { type: string, example: 商品不存在 }

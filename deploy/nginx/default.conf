upstream backend {
    server backend:8080;
    keepalive 32;
}

# 压测用：记录总耗时与上游耗时，便于区分网关开销和后端处理
log_format latency '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent $request_length $request_time '
                   '$upstream_addr $upstream_status $upstream_connect_time $upstream_response_time '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log latency;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 健康检查
    location = /health {
        access_log off;
        return 200 'ok';
    }

    # 压测采样：Actuator 仅允许本机与容器网段访问
    location /actuator/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://backend/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 前端接口统一走 /api 前缀，反代到后端时去掉前缀
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 路由回退：刷新 /orders 等前端路由不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 压测采样：仅允许容器网段与本机访问
server {
    listen 8081;
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}

server:
  port: 8082

spring:
  application:
    name: marketing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/doro_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        concurrency: 4
        max-concurrency: 8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 商品服务地址（营销只读商品：批量快照 + 关键字搜索）
marketing:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

# 秒杀参数。键名必须和 Shop 里保持一致：两个服务共用同一套 Redis key 和队列，
# 切换期间谁在跑都读得到同一个库存。
shop:
  seckill:
    bucket:
      size: ${SECKILL_BUCKETS:8}
    redis:
      prefix: ${SECKILL_REDIS_PREFIX:doro:seckill}
      activity-cache-enabled: true
      activity-cache-ttl-seconds: 30
      activity-cache-jitter-seconds: 10
      activity-cache-missing-ttl-seconds: 10
      reconcile-interval-ms: 300000
    async:
      enabled: true
      exchange: ${SECKILL_EXCHANGE:doroshop.seckill}
      queue: ${SECKILL_QUEUE:doroshop.seckill.order}
      routing-key: order
      dead-letter-exchange: doroshop.seckill.dlx
      dead-letter-queue: doroshop.seckill.order.dlq
      result-ttl-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.dking.marketing: INFO
